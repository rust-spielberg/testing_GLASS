<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 5px;
        }
        .cell {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            cursor: pointer;
        }
        .cell:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <div id="board" class="board"></div>
    <script>
        const board = Array.from({ length: 3 }, () => Array(3).fill(''));
        const boardElement = document.getElementById('board');
        let currentPlayer = 'X';

        function printBoard() {
            boardElement.innerHTML = '';
            board.forEach((row, rowIndex) => {
                row.forEach((cell, colIndex) => {
                    const cellElement = document.createElement('div');
                    cellElement.classList.add('cell');
                    cellElement.textContent = cell;
                    cellElement.addEventListener('click', () => handleCellClick(rowIndex, colIndex));
                    boardElement.appendChild(cellElement);
                });
            });
        }

        function checkWinner(player) {
            // Check rows
            for (let row of board) {
                if (row.every(cell => cell === player)) return true;
            }
            // Check columns
            for (let col = 0; col < 3; col++) {
                if (board.every(row => row[col] === player)) return true;
            }
            // Check diagonals
            if (board.every((row, index) => row[index] === player)) return true;
            if (board.every((row, index) => row[2 - index] === player)) return true;
            return false;
        }

        function isFull() {
            return board.every(row => row.every(cell => cell !== ''));
        }

        function handleCellClick(rowIndex, colIndex) {
            if (board[rowIndex][colIndex] !== '') return;
            board[rowIndex][colIndex] = currentPlayer;
            printBoard();
            if (checkWinner(currentPlayer)) {
                alert(`Player ${currentPlayer} wins!`);
                resetGame();
                return;
            }
            if (isFull()) {
                alert("It's a tie!");
                resetGame();
                return;
            }
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        }

        function resetGame() {
            board.fill('');
            currentPlayer = 'X';
            printBoard();
        }

        printBoard();
    </script>
</body>
</html>
